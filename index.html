<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NBA Stat Lab</title>
<link rel="stylesheet" href="https://unpkg.com/tabulator-tables@6.3.0/dist/css/tabulator.min.css">
<style>
  body { font-family: system-ui, sans-serif; margin: 0; padding: 16px; background: #f6f7f9; color: #1c1f24; }
  h1 { margin: 0 0 4px; font-size: 22px; }
  .sub { color: #5b6370; font-size: 13px; margin-bottom: 14px; }
  .panel { background: #fff; border: 1px solid #dfe3e8; border-radius: 8px; padding: 12px; margin-bottom: 12px; }
  .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  input { padding: 7px 9px; border: 1px solid #c4cad2; border-radius: 6px; font-size: 14px; }
  button { padding: 7px 12px; border: 0; border-radius: 6px; background: #1d4ed8; color: #fff; font-size: 14px; cursor: pointer; }
  button.secondary { background: #e5e8ec; color: #1c1f24; }
  #fname { width: 140px; }
  #fexpr { flex: 1; min-width: 240px; }
  #msg { font-size: 13px; margin-top: 8px; min-height: 18px; color: #b42318; }
  .chip { display: inline-flex; gap: 6px; align-items: center; background: #eef2ff; border-radius: 14px; padding: 3px 10px; font-size: 13px; margin: 6px 6px 0 0; }
  .chip b { cursor: pointer; color: #b42318; }
  .help { font-size: 12px; color: #5b6370; margin-top: 8px; line-height: 1.5; }
  code { background: #eef0f3; padding: 1px 4px; border-radius: 4px; }
</style>
</head>
<body>
<h1>NBA Stat Lab</h1>
<div class="sub" id="status">Loading stats…</div>

<div class="panel">
  <div class="row">
    <input id="fname" placeholder="Column name">
    <input id="fexpr" placeholder="Formula, e.g. (PTS + REB + AST) / MIN">
    <button id="addBtn">Add column</button>
  </div>
  <div id="msg"></div>
  <div id="chips"></div>
  <div class="help">
    Stat names you can use: <span id="vars"></span><br>
    Math: <code>+ - * / ( )</code>. Functions: <code>IF(test, a, b)</code>, <code>ROUND(x, 2)</code>, <code>AVERAGE(a, b, c)</code>, <code>sqrt()</code>, <code>max(a, b)</code>.<br>
    Example: <code>IF(MIN &gt; 20, PTS / MIN, 0)</code>. Column names must be one word (letters, numbers, underscore).
  </div>
</div>

<div class="panel">
  <div class="row">
    <input id="search" placeholder="Search player or team">
    <label>Min games played: <input id="mingp" type="number" value="1" min="0" style="width:70px"></label>
    <button class="secondary" id="csvBtn">Export CSV</button>
  </div>
</div>

<div id="table"></div>

<script src="https://cdn.jsdelivr.net/npm/mathjs@12.4.2/lib/browser/math.js"></script>
<script src="https://unpkg.com/tabulator-tables@6.3.0/dist/js/tabulator.min.js"></script>
<script>
// Excel-style helper functions
math.import({
  IF: (test, a, b) => (test ? a : b),
  AVERAGE: (...xs) => xs.reduce((s, x) => s + x, 0) / xs.length,
  ROUND: (x, n) => math.round(x, n || 0),
  SUM: (...xs) => xs.reduce((s, x) => s + x, 0),
}, { override: true });

const BASE_COLS = ["GP","MIN","PTS","REB","OREB","DREB","AST","STL","BLK","TOV","PF",
  "FGM","FGA","FG_PCT","FG3M","FG3A","FG3_PCT","FTM","FTA","FT_PCT","PLUS_MINUS"];

let players = [];
let formulas = [];
try { formulas = JSON.parse(localStorage.getItem("formulas") || "[]"); } catch (e) {}
let table = null;

const $ = id => document.getElementById(id);
const round2 = v => (typeof v === "number" && isFinite(v)) ? Math.round(v * 100) / 100 : v;

function saveFormulas() {
  try { localStorage.setItem("formulas", JSON.stringify(formulas)); } catch (e) {}
}

function scopeFor(row) {
  const s = {};
  for (const k in row) if (typeof row[k] === "number") s[k] = row[k];
  return s;
}

function evalFormula(expr, row) {
  const v = math.evaluate(expr, scopeFor(row));
  return (typeof v === "number" && isFinite(v)) ? v : null;
}

function recompute() {
  for (const row of players) {
    for (const f of formulas) {
      try { row[f.name] = evalFormula(f.expr, row); } catch (e) { row[f.name] = null; }
    }
  }
}

function filteredRows() {
  const q = $("search").value.trim().toLowerCase();
  const min = Number($("mingp").value) || 0;
  return players.filter(p =>
    p.GP >= min &&
    (!q || p.PLAYER.toLowerCase().includes(q) || (p.TEAM || "").toLowerCase().includes(q)));
}

function buildTable() {
  const numFmt = cell => round2(cell.getValue());
  const cols = [
    { title: "Player", field: "PLAYER", frozen: true, width: 180 },
    { title: "Team", field: "TEAM", width: 70 },
    ...BASE_COLS.map(c => ({ title: c, field: c, sorter: "number", hozAlign: "right", formatter: numFmt })),
    ...formulas.map(f => ({ title: f.name, field: f.name, sorter: "number", hozAlign: "right",
      formatter: numFmt, cssClass: "custom" })),
  ];
  table = new Tabulator("#table", {
    data: filteredRows(),
    columns: cols,
    layout: "fitDataStretch",
    height: "70vh",
    initialSort: [{ column: "PTS", dir: "desc" }],
  });
}

function renderChips() {
  $("chips").innerHTML = "";
  formulas.forEach((f, i) => {
    const el = document.createElement("span");
    el.className = "chip";
    el.innerHTML = `<span><strong>${f.name}</strong> = ${f.expr.replace(/</g, "&lt;")}</span>`;
    const x = document.createElement("b");
    x.textContent = "×";
    x.title = "Remove";
    x.onclick = () => { formulas.splice(i, 1); saveFormulas(); refresh(); };
    el.appendChild(x);
    $("chips").appendChild(el);
  });
}

function refresh() {
  recompute();
  renderChips();
  buildTable();
}

function addFormula() {
  const name = $("fname").value.trim();
  const expr = $("fexpr").value.trim();
  $("msg").textContent = "";
  if (!/^[A-Za-z_][A-Za-z0-9_]*$/.test(name)) {
    $("msg").textContent = "Give the column a one-word name (letters, numbers, underscore; can't start with a number)."; return;
  }
  if (BASE_COLS.includes(name) || formulas.some(f => f.name === name)) {
    $("msg").textContent = "That name is already used. Pick another."; return;
  }
  if (!expr) { $("msg").textContent = "Type a formula."; return; }
  try {
    // test on a row that includes earlier custom columns
    const test = players[0] ? { ...players[0] } : {};
    for (const f of formulas) test[f.name] = evalFormula(f.expr, test);
    evalFormula(expr, test);
  } catch (e) {
    $("msg").textContent = "Formula problem: " + e.message; return;
  }
  formulas.push({ name, expr });
  saveFormulas();
  $("fname").value = ""; $("fexpr").value = "";
  refresh();
}

$("addBtn").onclick = addFormula;
$("fexpr").addEventListener("keydown", e => { if (e.key === "Enter") addFormula(); });
$("search").addEventListener("input", () => table && table.setData(filteredRows()));
$("mingp").addEventListener("input", () => table && table.setData(filteredRows()));
$("csvBtn").onclick = () => table && table.download("csv", "nba_stats.csv");
$("vars").textContent = BASE_COLS.join(", ");

fetch("stats.json?_=" + Date.now())
  .then(r => { if (!r.ok) throw new Error("no file"); return r.json(); })
  .then(data => {
    players = data.players;
    const when = new Date(data.updated).toLocaleString();
    $("status").textContent = `${data.season} season, per-game stats. Last updated ${when}.`;
    refresh();
  })
  .catch(() => {
    $("status").textContent = "No stats.json found yet. Run the update workflow once (see setup steps).";
  });
</script>
</body>
</html>
