name: Update NBA stats

on:
  schedule:
    - cron: "0 9 * * *"    # morning run, about 5 AM Eastern
    - cron: "0 18 * * *"   # afternoon run, about 2 PM Eastern
  workflow_dispatch:       # lets you also run it by hand with a button

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install the NBA data package
        run: pip install nba_api

      - name: Download latest stats
        run: python fetch_stats.py

      - name: Save the new stats file
        run: |
          git config user.name "stats-bot"
          git config user.email "stats-bot@users.noreply.github.com"
          git add stats.json
          git diff --staged --quiet || git commit -m "Update stats"
          git push
